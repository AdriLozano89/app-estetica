<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Firma</title>
<style>
  :root { --gold:#e6c566; --gold-deep:#ba9530; --surface2:#1d1a26; --border:#2c2838; --text:#f3efe6; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--text); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent; }
  .wrap { padding:2px; }
  .pad { position:relative; }
  canvas { width:100%; height:190px; display:block; background:#fdfbf6; border:1px solid var(--gold-deep); border-radius:14px; touch-action:none; cursor:crosshair; }
  .hint { position:absolute; left:0; right:0; bottom:46px; text-align:center; color:#b7ad94; font-size:15px; pointer-events:none; transition:opacity .2s; }
  .baseline { position:absolute; left:6%; right:6%; bottom:44px; border-top:1px dashed #cfc5a6; pointer-events:none; }
  .bar { display:flex; gap:8px; margin-top:8px; }
  button { flex:1; min-height:46px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:16px; font-weight:500; cursor:pointer; }
  button.primary { background:linear-gradient(180deg,#f0d98c,var(--gold-deep)); color:#17130a; border:0; font-weight:600; }
  .msg { min-height:20px; margin-top:6px; font-size:14px; color:#b7ad94; text-align:center; }
  .msg.ok { color:#7fb89a; } .msg.err { color:#d9777f; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pad">
    <canvas id="c" aria-label="Zona de firma"></canvas>
    <div class="baseline"></div>
    <div class="hint" id="hint">Firma aquí con el dedo o el ratón</div>
  </div>
  <div class="bar">
    <button id="clear" type="button">Borrar</button>
    <button id="use" type="button" class="primary">Usar esta firma</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
  // Protocolo mínimo de componentes de Streamlit (sin dependencias ni compilación).
  const send = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
  const ready = () => send("streamlit:componentReady", { apiVersion: 1 });
  const setHeight = (h) => send("streamlit:setFrameHeight", { height: h });
  const setValue = (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" });

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  const msg = document.getElementById("msg");
  let drawing = false, dirty = false, last = null, ratio = 1;

  function fit() {
    ratio = Math.max(window.devicePixelRatio || 1, 1);
    const r = canvas.getBoundingClientRect();
    const snapshot = dirty ? canvas.toDataURL() : null;
    canvas.width = Math.round(r.width * ratio);
    canvas.height = Math.round(r.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a1a4d"; ctx.lineWidth = 2.8;
    if (snapshot) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = snapshot; }
  }
  function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    drawing = true; last = pos(e); dirty = true; hint.style.opacity = 0; msg.textContent = ""; msg.className = "msg";
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = "#1a1a4d"; ctx.fill();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e), mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke(); last = p;
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener("pointerup", stop); canvas.addEventListener("pointercancel", stop); canvas.addEventListener("pointerleave", stop);

  document.getElementById("clear").addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height); dirty = false; hint.style.opacity = 1;
    msg.textContent = ""; msg.className = "msg"; setValue(null);
  });
  document.getElementById("use").addEventListener("click", () => {
    if (!dirty) { msg.textContent = "Dibuja primero tu firma."; msg.className = "msg err"; return; }
    // Reducimos a 640 px de ancho (PNG con transparencia) para que pese poco.
    const w = 640, h = Math.round(canvas.height * (w / canvas.width));
    const out = document.createElement("canvas"); out.width = w; out.height = h;
    out.getContext("2d").drawImage(canvas, 0, 0, w, h);
    setValue(out.toDataURL("image/png"));
    msg.textContent = "Firma guardada ✓"; msg.className = "msg ok";
  });

  window.addEventListener("message", (e) => { if (e.data && e.data.type === "streamlit:render") { fit(); setHeight(document.body.scrollHeight + 8); } });
  window.addEventListener("resize", fit);
  ready(); fit(); setHeight(270);
</script>
</body>
</html>
